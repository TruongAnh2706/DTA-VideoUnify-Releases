name: Build & Release Executable

on:
  repository_dispatch:
    types: [build-release, build-exe-release]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          repository: TruongAnh2706/DTA-VideoUnify-Core
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ github.event.client_payload.ref || github.event.client_payload.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller httpx packaging PyQt6 requests

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=logo.ico --name="DTA_VideoUnify_Pro" --add-data="logo.png;." --add-data="logo.ico;." main.py

      - name: Setup Inno Setup
        uses: aminya/setup-innosetup@v2

      - name: Compile Inno Setup Installer
        run: |
          iscc setup_script.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.ref || github.event.client_payload.version }}
          name: "DTA VideoUnify Pro ${{ github.event.client_payload.ref || github.event.client_payload.version }}"
          files: Output/DTA_VideoUnify_Pro_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
