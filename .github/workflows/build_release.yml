name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller httpx packaging PyQt6 requests

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=logo.ico --name="DTA_VideoUnify_Pro" --add-data="logo.png;." --add-data="logo.ico;." main.py

      - name: Setup Inno Setup
        uses: aminya/setup-innosetup@v2

      - name: Compile Inno Setup Installer
        run: |
          iscc setup_script.iss

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DTA VideoUnify Pro ${{ github.ref_name }} Enterprise"
          body: |
            🎉 **DTA VideoUnify Pro ${{ github.ref_name }} Enterprise**
            
            **Tính năng mới & Cải tiến từ DTA Studio:**
            - ⚡ **Engine 1 Direct-Copy Concat siêu tốc**: Tốc độ gộp 100x - 500x speed (2-5 giây cho 50 phút video).
            - 🔒 **Khắc phục lỗi Win32 File Locking & UTF-8**: Tự động giải phóng file và hỗ trợ tên Tiếng Hàn/Việt.
            - 🖥️ **Giao diện Fullscreen Studio Dark Theme**: Tối ưu hiển thị và tự động nhớ kích thước.
            - 📑 **Chapter Markers & Intro/Outro Stitching**: Tự động tiêm thông tin chapter MP4/MKV.
          files: Output/DTA_VideoUnify_Pro_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
