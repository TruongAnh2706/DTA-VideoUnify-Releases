name: Trigger Public Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dispatch to Public Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PUBLIC_REPO_TRIGGER_TOKEN }}
          repository: TruongAnh2706/DTA-VideoUnify-Releases
          event-type: build-release
          client-payload: '{"ref": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'
